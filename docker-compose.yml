services:
  app:
    build:
      context: .
      target: deps
    image: personal-finance-dev
    command: npm run dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      # Report/period date math (lib/dates.ts startOfPeriod/endOfPeriod, lib/reports.ts
      # month bucketing) uses date-fns's local-timezone functions on Dates stored at
      # UTC midnight — pinning the process to UTC keeps "start of month" etc. aligned
      # with how dates are actually stored, regardless of the host machine's timezone.
      - TZ=UTC
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.13-alpine
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
